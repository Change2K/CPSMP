# CPSMP portal definitions.
#
# A portal is an inclusive integer cuboid spanned by pos1 and pos2 (block
# precision; no padding, no radius). A portal only triggers when the
# player's current block coordinate is inside that cuboid AND the
# portal's world matches the player's world.
#
# Set corners and target IN-GAME (corners are intentionally not pre-baked
# here so a fresh install never auto-triggers):
#   /cpsmpadmin setportal <name> pos1
#   /cpsmpadmin setportal <name> pos2
#   /cpsmpadmin setportal <name> target      # TELEPORT portals only
#
# Lifecycle and inspection:
#   /cpsmpadmin portal <name> enable
#   /cpsmpadmin portal <name> disable
#   /cpsmpadmin portal <name> reset          # clears pos1/pos2, disables
#   /cpsmpadmin portal <name> info           # full status + size
#
# Setting a corner NEVER auto-enables the portal. Admins enable explicitly
# only after the configuration is complete and verified.
#
# Supported portal keys (used by listeners):
#   lobby_to_smp
#   smp_rtp
#   smp_to_danger_zone
#   smp_to_attack_zone
#
# "sound" and "particles" accept either the legacy enum name
# (e.g. "BLOCK_BEACON_ACTIVATE", "PORTAL") or a namespaced key
# (e.g. "minecraft:block.beacon.activate", "minecraft:portal"). The
# namespaced form is more forward-compatible across Paper updates.

portals:
  lobby_to_smp:
    enabled: false
    type: "TELEPORT"
    cooldown-ms: 4000
    sound: "BLOCK_BEACON_ACTIVATE"
    particles: "PORTAL"
    title: "SMP"
    subtitle: "Willkommen auf dem SMP."
    actionbar: "<aqua>Du betrittst den SMP.</aqua>"
    target:
      world: "world"
      x: 0.5
      y: 100.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0

  smp_rtp:
    enabled: false
    type: "RTP"
    cooldown-ms: 4000
    sound: "ENTITY_ENDERMAN_TELEPORT"
    particles: "REVERSE_PORTAL"
    title: "<gradient:#f6d365:#fda085>Wildnis</gradient>"
    subtitle: "<gray>Suche dir deinen Platz in der Welt.</gray>"
    actionbar: "<gold>Zufaelliger Teleport...</gold>"
    # RTP portals ignore "target" and use rtp settings instead.

  smp_to_danger_zone:
    enabled: false
    type: "ZONE_DANGER"
    cooldown-ms: 4000
    sound: "BLOCK_RESPAWN_ANCHOR_CHARGE"
    particles: "FLAME"
    title: "Gefahrenzone"
    subtitle: "PvP ist aktiviert. Sei vorsichtig."
    actionbar: "<red>Du betrittst die Gefahrenzone.</red>"
    # Zone portals ignore "target" and use the configured zone spawn.

  smp_to_attack_zone:
    enabled: false
    type: "ZONE_ATTACK"
    cooldown-ms: 4000
    sound: "BLOCK_RESPAWN_ANCHOR_CHARGE"
    particles: "SOUL_FIRE_FLAME"
    title: "Attack-Zone"
    subtitle: "Kaempfe. Ueberlebe. Dominiere."
    actionbar: "<dark_red>Du betrittst die Attack-Zone.</dark_red>"
