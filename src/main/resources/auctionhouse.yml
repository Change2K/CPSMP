# CPSMP Auction House backend configuration.
#
# This file controls the storage backend, listing rules, fees, cleanup
# behavior and (since V2.3) the premium German GUI on top of the
# existing V2.1/V2.2 backend.
#
# All player-facing messages live in messages.yml under the `auction.*`
# branch and are written in German.

# Master switch. When false the Auction House refuses every player-facing
# command with `auction.disabled` and the expiry task does not run. The
# rest of CPSMP (spawn, RTP, portals, zones, economy bridge) is unaffected.
enabled: true

storage:
  # Storage backend. Only "sqlite" is supported in V2.1.
  type: sqlite
  # SQLite database file, relative to the plugin data folder.
  file: auctionhouse.db

listings:
  # Lifetime of a fresh listing before AuctionExpiryService marks it as
  # EXPIRED and moves the item into the seller's collect storage.
  duration-hours: 72
  # Maximum number of simultaneously ACTIVE listings per seller.
  # Permission-based overrides will be added in a later version; for now
  # this is a single global limit applied to everyone except admins
  # (cpsmp.ah.admin bypasses the check).
  max-active-listings-default: 5
  # Inclusive price bounds. /ah sell rejects anything outside this range
  # with `auction.price-too-low` / `auction.price-too-high`.
  min-price: 1.0
  max-price: 1000000.0
  # When false, /ah buy refuses to buy your own listing (the GUI also
  # disables the click on browse tiles owned by you). When true, the
  # marketplace allows self-purchase - useful for staff testing.
  allow-own-purchase: false

fees:
  # Currency removed from the seller via EconomyBridge.withdraw the moment
  # a listing is created. Set to 0.0 to disable the listing fee entirely
  # (no withdraw is attempted; selling works even with NoEconomyBridge as
  # long as `require-economy-for-auction-house` in economy.yml is false).
  listing-fee: 0.0
  # Percentage of the gross price that is taken as sale tax when a
  # listing sells. The buyer pays the full price, the seller is paid
  # the post-tax net amount. Set to 0.0 to disable the sale tax.
  sale-tax-percent: 5.0

confirmations:
  # When the GUI is enabled and `gui.confirmation.enabled` is true,
  # listings priced at or above this threshold open a "Kauf bestaetigen"
  # confirmation screen before the buy is dispatched. Listings below
  # the threshold buy immediately on click (the backend still
  # re-validates everything atomically).
  expensive-purchase-threshold: 10000.0

blocked-items:
  # Materials that may never be listed. Case-insensitive Bukkit Material
  # names (e.g. "BEDROCK", "COMMAND_BLOCK"). /ah sell rejects them with
  # `auction.blocked-item`. Empty list means "no extra block list" (air
  # and unobtainable items are always rejected regardless).
  materials: []

cleanup:
  # How often AuctionExpiryService scans the listings table for ACTIVE
  # rows whose expires_at <= now. Each scan runs asynchronously and only
  # touches the DB; no Bukkit API is used off-thread.
  # The scan is idempotent: even if it runs twice in parallel, a listing
  # can only be moved into collect storage once.
  expire-check-interval-seconds: 60

browse:
  # Number of listings shown per /ah browse page in chat. Clamped to
  # [3, 50] so the text overview stays readable. The V2.3 GUI grid
  # size is derived from `gui.rows.browse` below and ignores this
  # value.
  page-size: 8

# Premium German GUI (V2.3). All rules below only affect the inventory
# GUI; the underlying /ah text commands keep working exactly as in
# V2.1/V2.2 when the GUI is disabled or unavailable.
gui:
  # Master GUI switch. When false, /ah falls back to the German text
  # help and the GUI listener simply does nothing.
  enabled: true
  # Row counts per screen. Bukkit inventories must be 1-6 rows; the
  # main hub is capped at 3 rows because it never needs more buttons.
  rows:
    main: 3
    browse: 6
    listings: 6
    collect: 6
  # When true, the GUI re-fetches and re-renders after a successful
  # buy / cancel / collect so the player sees the new state without
  # closing the inventory.
  refresh-after-action: true
  # Confirmation dialog for expensive purchases. Threshold is
  # `confirmations.expensive-purchase-threshold` above.
  confirmation:
    enabled: true
  # Visual filler used for empty slots. Set `enabled: false` for a
  # raw inventory background.
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "

# Verbose logging for AH operations (listing create/cancel/expire,
# storage init, transaction outcomes). Off by default.
debug: false
