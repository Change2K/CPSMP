world-inventory:
  preserve-between-cpsmp-worlds: true
  shared-worlds:
    - smp
    - danger_zone
    - attack_zone
  warn-if-external-inventory-plugin-detected: true

zones:
  danger:
    enabled: true
    world: "world"
    spawn:
      enabled: false
      world: "world"
      x: 0.5
      y: 100.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
    rules:
      pvp: true
      keep-inventory: false
      allow-build: false
      allow-item-drop: true

  attack:
    enabled: true
    world: "world"
    spawn:
      enabled: false
      world: "world"
      x: 0.5
      y: 100.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
    rules:
      pvp: true
      keep-inventory: false
      allow-build: false
      allow-item-drop: true
