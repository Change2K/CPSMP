# CPSMP V4.0.2 Claims / base protection (German messages in messages.yml).

claims:
  enabled: true
  storage:
    type: sqlite
    file: claims.db

  worlds:
    allowed:
      - smp
    blocked:
      - danger_zone
      - attack_zone

  creation:
    default-radius-x: 8
    default-radius-z: 8
    min-size-x: 5
    min-size-z: 5
    max-size-x: 64
    max-size-z: 64
    prevent-overlap: true

  limits:
    default-claim-limit: 4

  merge:
    enabled: true
    require-same-world: true
    allow-diagonal-touch: false
    require-standing-in-owned-claim: true

  protection:
    block-break: true
    block-place: true
    containers: true
    doors: true
    redstone-interaction: false
    entity-damage: true
    item-frames: true
    armor-stands: true
    vehicles: true
    explosions: true
    fire-spread: true
    liquid-flow: true
    buckets: true

  # Claim outline: default is BlockDisplay (display mode), non-blocking, no real blocks.
  # WorldBorder mode (worldborder_if_safe) is NOT recommended: Paper/Bukkit applies a real
  # per-player world border that can block movement. Enable only with allow-worldborder-mode: true.
visuals:
  enabled: true
  mode: display
  allow-worldborder-mode: false
  fallback-mode: none
  duration-seconds: 20
  show-once-is-toggle: true
  clear-on-world-change: true
  refresh-interval-ticks: 20
  show-radius-blocks: 15

  display:
    enabled: true
    material: LIGHT_BLUE_STAINED_GLASS
    corner-material: GOLD_BLOCK
    y-offsets:
      - 0.1
      - 1.1
    line-step-blocks: 2
    max-display-entities-per-player: 300
    scale: 0.15

  particles:
    enabled: false
    enabled-as-fallback: false
    static: true
    particle: END_ROD
    border-particle: END_ROD
    color: "#f6d365"
    secondary-color: "#fda085"
    y-offsets:
      - 0.2
      - 1.2
    line-step-blocks: 1
    interval-ticks: 20
    max-visible-particles-per-tick: 80

  # When false, /plot is rejected in-game; use /cpplot show or /claim show instead (PlotSquared-safe).
  plot-alias:
    enabled: true

  admin:
    bypass-actionbar: true
    bypass-actionbar-cooldown-ms: 2500
