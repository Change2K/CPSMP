name: CPSMP
version: '${project.version}'
main: de.deinserver.cpsmp.CPSMPPlugin
# api-version is the Minecraft minor that CPSMP targets. Paper/Spigot accept
# any 1.21.x server with this value. When migrating to a newer Minecraft
# major.minor, bump this and the paper.api.version in pom.xml together and
# re-test. See COMPATIBILITY.md.
api-version: '1.21'
author: deinserver
description: Premium SMP foundation plugin (V2.1).
load: POSTWORLD

# Paper runtime library loading. CPSMP uses SQLite for the V2.1 Auction
# House backend. Paper resolves and class-loads this library from Maven
# Central before the plugin is enabled, so we never have to shade it.
# On Spigot/CraftBukkit this directive is ignored; the Auction House then
# detects the missing JDBC driver, logs a clear German message and
# disables itself without affecting the rest of the plugin.
# See DEPENDENCIES.md.
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.0

# Vault is an optional soft-dependency. CPSMP core works without it.
# When Vault is present AND a Vault economy provider is registered (e.g.
# EssentialsX, CMI, XConomy), CPSMP uses it for the V2 economy bridge.
# Without Vault, NoEconomyBridge is installed and economy-dependent
# features (Auction House) disable themselves gracefully.
# See DEPENDENCIES.md.
softdepend:
  - Vault

commands:
  # /spawn is intentionally NOT registered by CPSMP. The /spawn command is
  # left free for other plugins to claim. CPSMP only owns /smpspawn for
  # teleporting to the configured SMP spawn point.
  smpspawn:
    description: Teleportiere dich zum SMP-Spawn.
    usage: /smpspawn
    permission: cpsmp.spawn
  rtp:
    description: Zufaelliger Teleport in der aktuellen Welt.
    usage: /rtp
    permission: cpsmp.rtp
  ah:
    description: Auktionshaus - Items verkaufen, eigene Angebote verwalten und Abholungen einsammeln.
    usage: /ah [sell|listings|cancel|collect|admin]
    aliases: [auctionhouse, auktion]
    permission: cpsmp.ah
  cpsmpadmin:
    description: Administrative Befehle fuer CPSMP.
    usage: /cpsmpadmin <setspawn|setportal|setzone|reload|info>
    permission: cpsmp.admin
    aliases: [cpsmpa, cpa]

permissions:
  cpsmp.spawn:
    description: Erlaubt /smpspawn.
    default: true
  cpsmp.rtp:
    description: Erlaubt /rtp.
    default: true
  cpsmp.rtp.bypasscooldown:
    description: Erlaubt das Ueberspringen des /rtp-Cooldowns.
    default: op
  cpsmp.portal.use:
    description: Erlaubt Portalbenutzung.
    default: true
  cpsmp.portal.bypass:
    description: Erlaubt das Umgehen von Portalen waehrend des Schleichens.
    default: op
  cpsmp.zone.danger:
    description: Erlaubt das Betreten der Gefahrenzone.
    default: true
  cpsmp.zone.attack:
    description: Erlaubt das Betreten der Attack-Zone.
    default: true
  # Auction House permissions. /ah is enabled for everyone by default and
  # gates its subcommands on the finer-grained nodes below so a server
  # owner can disable e.g. selling without disabling the whole command.
  # cpsmp.admin intentionally only includes cpsmp.ah.admin; admins have
  # to opt in to the player-level nodes the same way regular players do.
  cpsmp.ah:
    description: Erlaubt /ah.
    default: true
  cpsmp.ah.sell:
    description: Erlaubt /ah sell.
    default: true
  cpsmp.ah.cancel:
    description: Erlaubt /ah cancel.
    default: true
  cpsmp.ah.collect:
    description: Erlaubt /ah collect.
    default: true
  cpsmp.ah.browse:
    description: Erlaubt /ah browse.
    default: true
  cpsmp.ah.buy:
    description: Erlaubt /ah buy.
    default: true
  cpsmp.ah.admin:
    description: Erlaubt /ah admin (entfernen, info, reload).
    default: op
  cpsmp.admin:
    description: Voller Adminzugriff fuer CPSMP.
    default: op
    children:
      cpsmp.reload: true
      cpsmp.rtp.bypasscooldown: true
      cpsmp.portal.bypass: true
      cpsmp.ah.admin: true
  cpsmp.reload:
    description: Erlaubt das Neuladen der Konfiguration.
    default: op
