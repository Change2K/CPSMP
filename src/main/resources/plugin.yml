name: CPSMP
version: '${project.version}'
main: de.deinserver.cpsmp.CPSMPPlugin
# api-version is the Minecraft minor that CPSMP targets. Paper/Spigot accept
# any 1.21.x server with this value. When migrating to a newer Minecraft
# major.minor, bump this and the paper.api.version in pom.xml together and
# re-test. See COMPATIBILITY.md.
api-version: '1.21'
author: deinserver
description: Premium SMP foundation plugin (V4.0.2).
load: POSTWORLD

# Paper runtime library loading. CPSMP uses SQLite for the Auction House,
# V3.0+ Homes /back, and V4.0 Claims. Paper resolves and class-loads this
# library from Maven Central before the plugin is enabled.
# On Spigot/CraftBukkit this directive is ignored; features that need JDBC
# detect the missing driver, log a clear German message and disable
# themselves without affecting the rest of the plugin.
# See DEPENDENCIES.md.
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.0

# Vault is an optional soft-dependency. CPSMP core works without it.
# When Vault is present AND a Vault economy provider is registered (e.g.
# EssentialsX, CMI, XConomy), CPSMP uses it for the V2 economy bridge.
# Without Vault, NoEconomyBridge is installed and economy-dependent
# features (Auction House) disable themselves gracefully.
# See DEPENDENCIES.md.
softdepend:
  - Vault

commands:
  # /spawn is intentionally NOT registered by CPSMP. The /spawn command is
  # left free for other plugins to claim. CPSMP only owns /smpspawn for
  # teleporting to the configured SMP spawn point.
  smpspawn:
    description: Teleportiere dich zum SMP-Spawn.
    usage: /smpspawn
    permission: cpsmp.spawn
  rtp:
    description: Zufaelliger Teleport in der aktuellen Welt.
    usage: /rtp
    permission: cpsmp.rtp
  sethome:
    description: Setze ein benanntes Home.
    usage: /sethome <name>
    permission: cpsmp.home.set
  cpsethome:
    description: CPSMP-Alias fuer /sethome (Fallback bei Befehlskonflikten).
    usage: /cpsethome <name>
    permission: cpsmp.home.set
  home:
    description: Teleportiere zu einem Home.
    usage: /home <name>
    permission: cpsmp.home
  cphome:
    description: CPSMP-Alias fuer /home.
    usage: /cphome <name>
    permission: cpsmp.home
  homes:
    description: Liste deiner Homes (GUI oder Chat).
    usage: /homes
    permission: cpsmp.home
  cphomes:
    description: CPSMP-Alias fuer /homes.
    usage: /cphomes
    permission: cpsmp.home
  delhome:
    description: Loesche ein Home.
    usage: /delhome <name>
    permission: cpsmp.home.delete
  cpdelhome:
    description: CPSMP-Alias fuer /delhome.
    usage: /cpdelhome <name>
    permission: cpsmp.home.delete
  tpa:
    description: Teleportanfrage an einen Spieler senden.
    usage: /tpa <spieler>
    permission: cpsmp.tpa
  cptpa:
    description: CPSMP-Alias fuer /tpa.
    usage: /cptpa <spieler>
    permission: cpsmp.tpa
  tpaccept:
    description: Teleportanfrage annehmen.
    usage: /tpaccept
    permission: cpsmp.tpa.accept
  cptpaccept:
    description: CPSMP-Alias fuer /tpaccept.
    usage: /cptpaccept
    permission: cpsmp.tpa.accept
  tpdeny:
    description: Teleportanfrage ablehnen.
    usage: /tpdeny
    permission: cpsmp.tpa.deny
  cptpdeny:
    description: CPSMP-Alias fuer /tpdeny.
    usage: /cptpdeny
    permission: cpsmp.tpa.deny
  tpahere:
    description: Bittet einen Spieler, sich zu dir zu teleportieren.
    usage: /tpahere <spieler>
    permission: cpsmp.tpa.here
  cptpahere:
    description: CPSMP-Alias fuer /tpahere.
    usage: /cptpahere <spieler>
    permission: cpsmp.tpa.here
  back:
    description: Zurueck zur letzten CPSMP-Teleportposition.
    usage: /back
    permission: cpsmp.back
  cpback:
    description: CPSMP-Alias fuer /back.
    usage: /cpback
    permission: cpsmp.back
  claim:
    description: Claim erstellen, Grenze anzeigen, mergen oder Admin-TP (/claim <Spieler> <Claim>).
    usage: "/claim | /claim show | /claim merge all | /claim <Spieler> <Claim>"
  cpclaim:
    description: CPSMP-Alias fuer /claim.
    usage: "/cpclaim | /cpclaim show | /cpclaim merge all | /cpclaim <Spieler> <Claim>"
  merge:
    description: Angrenzende eigene Claims zusammenfuehren.
    usage: /merge all
    permission: cpsmp.claim.merge
  cpmerge:
    description: CPSMP-Alias fuer /merge.
    usage: /cpmerge all
    permission: cpsmp.claim.merge
  plot:
    description: Claim-Grenze anzeigen (Plot-Alias, optional deaktivierbar).
    usage: "/plot show | /plot show toggle"
  cpplot:
    description: CPSMP Claim-Grenze ohne /plot-Konflikte.
    usage: "/cpplot show | /cpplot show toggle"
  claiminfo:
    description: Zeige Claim-Infos an deiner Position.
    usage: /claiminfo
    permission: cpsmp.claim.info
  cpclaiminfo:
    description: CPSMP-Alias fuer /claiminfo.
    usage: /cpclaiminfo
    permission: cpsmp.claim.info
  claims:
    description: Uebersicht deiner Claims/Plots (GUI).
    usage: /claims
    permission: cpsmp.claim.list
  cpclaims:
    description: CPSMP-Alias fuer /claims.
    usage: /cpclaims
    permission: cpsmp.claim.list
  plots:
    description: Zeige deine Claims/Plots im GUI (Alias zu /claims).
    usage: /plots
    permission: cpsmp.claim.list
  cpplots:
    description: CPSMP-Alias fuer /plots.
    usage: /cpplots
    permission: cpsmp.claim.list
  trust:
    description: Vertraue einem Spieler im aktuellen Claim.
    usage: /trust <spieler>
    permission: cpsmp.claim.trust
  cptrust:
    description: CPSMP-Alias fuer /trust.
    usage: /cptrust <spieler>
    permission: cpsmp.claim.trust
  untrust:
    description: Entferne Vertrauen im aktuellen Claim.
    usage: /untrust <spieler>
    permission: cpsmp.claim.untrust
  cpuntrust:
    description: CPSMP-Alias fuer /untrust.
    usage: /cpuntrust <spieler>
    permission: cpsmp.claim.untrust
  trustlist:
    description: Zeige vertraute Spieler im aktuellen Claim.
    usage: /trustlist
    permission: cpsmp.claim.trust
  cptrustlist:
    description: CPSMP-Alias fuer /trustlist.
    usage: /cptrustlist
    permission: cpsmp.claim.trust
  abandonclaim:
    description: Gebe das Claim an deiner Position auf (2 Schritte).
    usage: /abandonclaim
    permission: cpsmp.claim.abandon
  cpabandonclaim:
    description: CPSMP-Alias fuer /abandonclaim.
    usage: /cpabandonclaim
    permission: cpsmp.claim.abandon
  claimadmin:
    description: CPSMP Claim-Administration.
    usage: /claimadmin <info <Spieler>|delete <Spieler> <Claim>|deleteglobal <id>|reload>
    permission: cpsmp.claim.admin
  ah:
    description: Auktionshaus - Items verkaufen, eigene Angebote verwalten und Abholungen einsammeln.
    usage: /ah [sell|listings|cancel|collect|admin]
    aliases: [auctionhouse, auktion]
    permission: cpsmp.ah
  cpsmpadmin:
    description: Administrative Befehle fuer CPSMP.
    usage: /cpsmpadmin <setspawn|setportal|portal|setzone|homes|refreshmessages|reload|info>
    permission: cpsmp.admin
    aliases: [cpsmpa, cpa]

permissions:
  cpsmp.spawn:
    description: Erlaubt /smpspawn.
    default: true
  cpsmp.rtp:
    description: Erlaubt /rtp.
    default: true
  cpsmp.rtp.bypasscooldown:
    description: Erlaubt das Ueberspringen des /rtp-Cooldowns.
    default: op
  cpsmp.portal.use:
    description: Erlaubt Portalbenutzung.
    default: true
  cpsmp.portal.bypass:
    description: Erlaubt das Umgehen von Portalen waehrend des Schleichens.
    default: op
  cpsmp.zone.danger:
    description: Erlaubt das Betreten der Gefahrenzone.
    default: true
  cpsmp.zone.attack:
    description: Erlaubt das Betreten der Attack-Zone.
    default: true
  cpsmp.home:
    description: Erlaubt /home, /homes, /cphome, /cphomes.
    default: true
  cpsmp.home.set:
    description: Erlaubt /sethome und /cpsethome.
    default: true
  cpsmp.home.delete:
    description: Erlaubt /delhome und /cpdelhome.
    default: true
  cpsmp.home.gui:
    description: Erlaubt die Homes-GUI (wenn in teleports.yml aktiviert).
    default: true
  cpsmp.homes.1:
    description: Mindestens 1 Home (wenn hoehere homes.* fehlen).
    default: false
  cpsmp.homes.3:
    description: Mindestens 3 Homes.
    default: false
  cpsmp.homes.5:
    description: Mindestens 5 Homes.
    default: false
  cpsmp.homes.10:
    description: Mindestens 10 Homes.
    default: false
  cpsmp.homes.unlimited:
    description: Unbegrenzte Homes.
    default: op
  cpsmp.home.bypasscooldown:
    description: Ueberspringt Home- und optional /back-Cooldowns.
    default: op
  cpsmp.tpa:
    description: Erlaubt /tpa und /cptpa.
    default: true
  cpsmp.tpa.accept:
    description: Erlaubt /tpaccept und /cptpaccept.
    default: true
  cpsmp.tpa.deny:
    description: Erlaubt /tpdeny und /cptpdeny.
    default: true
  cpsmp.tpa.here:
    description: Erlaubt /tpahere und /cptpahere.
    default: true
  cpsmp.tpa.bypasscooldown:
    description: Ueberspringt TPA-Cooldowns.
    default: op
  cpsmp.back:
    description: Erlaubt /back und /cpback.
    default: false
  cpsmp.claim:
    description: Erlaubt /claim und /cpclaim (Claim erstellen).
    default: true
    children:
      cpsmp.claim.show: true
      cpsmp.claim.merge: true
  cpsmp.claim.teleport.admin:
    description: Erlaubt /claim <Spieler> <Claim> (Teleport zum Claim eines Spielers).
    default: op
  cpsmp.claim.merge:
    description: Erlaubt /merge all, /claim merge all und den Merge-Button in der Claims-GUI.
    default: true
  cpsmp.claim.show:
    description: Erlaubt /claim show, /plot show (Claim-Grenze).
    default: true
  cpsmp.claim.info:
    description: Erlaubt Claim-Infos.
    default: true
  cpsmp.claim.list:
    description: Erlaubt /claims und /cpclaims.
    default: true
  cpsmp.claim.trust:
    description: Erlaubt Vertrauen und Trustliste.
    default: true
  cpsmp.claim.untrust:
    description: Erlaubt /untrust /cpuntrust.
    default: true
  cpsmp.claim.abandon:
    description: Erlaubt /abandonclaim /cpabandonclaim.
    default: true
  cpsmp.claim.bypass:
    description: Umgeht Claim-Schutz (mit Hinweis).
    default: op
  cpsmp.claim.admin:
    description: Claim-Admin-Befehle (/claimadmin).
    default: op
  cpsmp.claims.1:
    description: Mindestens 1 Claim (wenn hoehere claims.* fehlen).
    default: true
  cpsmp.claims.3:
    description: Mindestens 3 Claims.
    default: false
  cpsmp.claims.4:
    description: Mindestens 4 Claims (Standard fuer Spieler ohne hoehere claims.*).
    default: true
  cpsmp.claims.5:
    description: Mindestens 5 Claims.
    default: false
  cpsmp.claims.10:
    description: Mindestens 10 Claims.
    default: false
  cpsmp.claims.unlimited:
    description: Unbegrenzte Claims.
    default: op
  # Auction House permissions. /ah is enabled for everyone by default and
  # gates its subcommands on the finer-grained nodes below so a server
  # owner can disable e.g. selling without disabling the whole command.
  # cpsmp.admin intentionally only includes cpsmp.ah.admin; admins have
  # to opt in to the player-level nodes the same way regular players do.
  cpsmp.ah:
    description: Erlaubt /ah.
    default: true
  cpsmp.ah.sell:
    description: Erlaubt /ah sell.
    default: true
  cpsmp.ah.listings:
    description: Erlaubt /ah listings und die GUI-Ansicht eigener Angebote.
    default: true
  cpsmp.ah.cancel:
    description: Erlaubt /ah cancel.
    default: true
  cpsmp.ah.collect:
    description: Erlaubt /ah collect.
    default: true
  cpsmp.ah.browse:
    description: Erlaubt /ah browse.
    default: true
  cpsmp.ah.buy:
    description: Erlaubt /ah buy.
    default: true
  cpsmp.ah.admin:
    description: Erlaubt /ah admin (entfernen, info, reload).
    default: op
  cpsmp.admin:
    description: Voller Adminzugriff fuer CPSMP.
    default: op
    children:
      cpsmp.reload: true
      cpsmp.rtp.bypasscooldown: true
      cpsmp.portal.bypass: true
      cpsmp.ah.admin: true
      cpsmp.claim.admin: true
      cpsmp.claim.bypass: true
      cpsmp.claim.teleport.admin: true
  cpsmp.reload:
    description: Erlaubt das Neuladen der Konfiguration.
    default: op
