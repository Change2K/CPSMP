# CPSMP V1 main configuration.
# All player-facing strings live in messages.yml.

settings:
  # Prefix tag used in chat messages (Adventure MiniMessage format).
  prefix: "<gradient:#5BCEFA:#F5A9B8><bold>CPSMP</bold></gradient> <dark_gray>|</dark_gray> "
  # Locale tag, mostly informational. Player-facing strings are German by design.
  locale: "de_DE"

teleport:
  # Delay before /smpspawn /rtp teleports complete (seconds).
  delay-seconds: 3
  # Cancel teleport if the player moves more than this many blocks horizontally.
  move-threshold: 0.35
  # Cancel teleport if the player takes any damage.
  cancel-on-damage: true
  # Sound played on successful teleport. Accepts either the legacy enum
  # name (e.g. "ENTITY_ENDERMAN_TELEPORT") or a namespaced key
  # (e.g. "minecraft:entity.enderman.teleport"). The namespaced form is
  # the more forward-compatible choice for newer Paper versions.
  success-sound: "ENTITY_ENDERMAN_TELEPORT"
  success-sound-volume: 0.7
  success-sound-pitch: 1.2

spawn:
  # World containing the SMP spawn. Configurable.
  world: "world"
  # Set in-game via /cpsmpadmin setspawn.
  location:
    enabled: false
    world: "world"
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

rtp:
  # Cooldown for /rtp (seconds).
  # OP players and holders of the permission "cpsmp.rtp.bypasscooldown"
  # ignore this cooldown entirely (also applies to the smp_rtp portal).
  cooldown-seconds: 120
  # Allowed worlds for /rtp. Any other world rejects the command.
  allowed-worlds:
    - "world"
  # Radius range from world spawn (or 0,0 if not present).
  min-radius: 500
  max-radius: 5000
  # How many random attempts to find a safe location before giving up.
  max-attempts: 40
  # Use the highest non-air block (recommended for overworld RTP).
  use-highest-block: true
  # Unsafe blocks that disqualify a candidate location.
  unsafe-blocks:
    - "LAVA"
    - "WATER"
    - "FIRE"
    - "SOUL_FIRE"
    - "CACTUS"
    - "POWDER_SNOW"
    - "MAGMA_BLOCK"
    - "SWEET_BERRY_BUSH"
    - "WITHER_ROSE"
    - "VOID_AIR"

portals:
  # Per-player cooldown after using any portal (milliseconds).
  # Prevents teleport loops between back-to-back regions.
  global-cooldown-ms: 4000
  # How often (ticks) we scan players for portal entry. 5 ticks = 4 checks / second.
  check-interval-ticks: 5

portal-setup:
  # Portal regions are inclusive cuboids spanned by pos1 and pos2 (block
  # precision). If the total volume of a configured portal exceeds this
  # threshold, /cpsmpadmin setportal and /cpsmpadmin portal info will warn
  # the admin to double-check pos1 and pos2.
  large-region-warning-volume: 100

zones:
  # Per-player cooldown when re-entering a zone (milliseconds).
  enter-message-cooldown-ms: 8000

# Internal debugging.
debug: false
