# CPSMP player-facing strings (German).
# MiniMessage format. {placeholders} are replaced at runtime.

general:
  no-permission: "<red>Dazu hast du keine Berechtigung.</red>"
  player-only: "<red>Dieser Befehl ist nur fuer Spieler verfuegbar.</red>"
  unknown-command: "<red>Unbekannter Befehl.</red>"
  reload-success: "<green>Konfiguration wurde neu geladen.</green>"
  world-missing: "<red>Welt <yellow>{world}</yellow> ist nicht geladen.</red>"
  cooldown: "<gray>Bitte warte noch <yellow>{time}</yellow> Sekunden.</gray>"

teleport:
  start: "<gray>Teleportation startet...</gray>"
  countdown-actionbar: "<gray>Teleport in <yellow>{time}</yellow>s <dark_gray>|</dark_gray> <red>Bewege dich nicht.</red></gray>"
  do-not-move: "<red>Bewege dich nicht.</red>"
  cancelled-move: "<red>Teleportation abgebrochen.</red>"
  cancelled-damage: "<red>Teleportation durch Schaden abgebrochen.</red>"
  success: "<green>Teleportation erfolgreich.</green>"

spawn:
  welcome-title: "SMP-Spawn"
  welcome-subtitle: "Willkommen am SMP-Spawn."
  welcome-actionbar: "<green>Willkommen am SMP-Spawn.</green>"
  not-configured: "<red>Der SMP-Spawn wurde noch nicht gesetzt.</red>"

rtp:
  searching-actionbar: "<gray>Suche sicheren Ort...</gray>"
  found-actionbar: "<green>Sicherer Ort gefunden.</green>"
  success-title: "CPSMP"
  success-subtitle: "Dein Abenteuer beginnt."
  failed: "<red>Es konnte kein sicherer Ort gefunden werden.</red>"
  world-not-allowed: "<red>RTP ist in dieser Welt nicht erlaubt.</red>"

portal:
  cooldown: "<gray>Portal-Cooldown. Bitte kurz warten.</gray>"
  default-title: "Portal"
  default-subtitle: "Du wirst teleportiert."
  default-actionbar: "<aqua>Portal aktiviert.</aqua>"
  target-missing: "<red>Dieses Portal ist nicht korrekt konfiguriert.</red>"
  bypass-active: "<gray>Portal-Bypass aktiv, solange du schleichst.</gray>"
  not-inside: "<gray>Du stehst nicht im Portalbereich.</gray>"

zones:
  danger:
    enter-title: "Gefahrenzone"
    enter-subtitle: "PvP ist aktiviert. Sei vorsichtig."
    enter-actionbar: "<red>Du betrittst die Gefahrenzone.</red>"
    no-permission: "<red>Du darfst die Gefahrenzone nicht betreten.</red>"
    not-configured: "<red>Die Gefahrenzone ist noch nicht konfiguriert.</red>"
  attack:
    enter-title: "Attack-Zone"
    enter-subtitle: "Kaempfe. Ueberlebe. Dominiere."
    enter-actionbar: "<dark_red>Du betrittst die Attack-Zone.</dark_red>"
    no-permission: "<red>Du darfst die Attack-Zone nicht betreten.</red>"
    not-configured: "<red>Die Attack-Zone ist noch nicht konfiguriert.</red>"

admin:
  usage: "<gray>Nutzung: <yellow>/cpsmpadmin <setspawn|setportal|portal|setzone|reload|info></yellow></gray>"
  spawn-set: "<green>SMP-Spawn wurde gesetzt.</green>"
  # /cpsmpadmin setportal feedback (just saving a corner; never enables).
  portal-set-pos1: "<green>Portal <yellow>{portal}</yellow>: Position 1 gesetzt.</green>"
  portal-set-pos2: "<green>Portal <yellow>{portal}</yellow>: Position 2 gesetzt.</green>"
  portal-set-target: "<green>Portal <yellow>{portal}</yellow>: Zielort gesetzt.</green>"
  portal-unknown: "<red>Unbekanntes Portal: <yellow>{portal}</yellow></red>"
  portal-usage: "<gray>Nutzung: <yellow>/cpsmpadmin setportal <name> <pos1|pos2|target></yellow></gray>"
  # Setup-safety warnings raised by setCorner / portal info / portal enable.
  portal-incomplete: "<yellow>Portal ist unvollstaendig. Beide Ecken (pos1 und pos2) muessen gesetzt sein.</yellow>"
  portal-cross-world: "<red>pos1 und pos2 muessen in derselben Welt liegen.</red>"
  portal-size: "<gray>Portalbereich: <yellow>{sizeX}x{sizeY}x{sizeZ}</yellow> Bloecke.</gray>"
  portal-large-region: "<gold>Achtung: Dieser Portalbereich ist sehr gross (<yellow>{size}</yellow> Bloecke). Pruefe pos1 und pos2.</gold>"
  # /cpsmpadmin portal <name> <action> feedback.
  portal-action-usage: "<gray>Nutzung: <yellow>/cpsmpadmin portal <name> <enable|disable|reset|info></yellow></gray>"
  portal-enabled: "<green>Portal <yellow>{portal}</yellow> aktiviert.</green>"
  portal-disabled: "<gray>Portal <yellow>{portal}</yellow> deaktiviert.</gray>"
  portal-reset: "<gray>Portal <yellow>{portal}</yellow> zurueckgesetzt.</gray>"
  portal-valid: "<green>Portal ist gueltig.</green>"
  portal-invalid: "<red>Portal ist ungueltig.</red>"
  portal-info-header: "<gradient:#5BCEFA:#F5A9B8><bold>Portal {portal}</bold></gradient>"
  portal-info-enabled: "<gray>Aktiviert: <yellow>{state}</yellow></gray>"
  portal-info-type: "<gray>Typ: <yellow>{type}</yellow></gray>"
  portal-info-world: "<gray>Welt: <yellow>{world}</yellow></gray>"
  portal-info-pos1: "<gray>pos1: <yellow>{pos}</yellow></gray>"
  portal-info-pos2: "<gray>pos2: <yellow>{pos}</yellow></gray>"
  portal-info-bounds: "<gray>Normalisiert: <yellow>{min}</yellow> -> <yellow>{max}</yellow></gray>"
  portal-info-target: "<gray>Zielort: <yellow>{target}</yellow></gray>"
  zone-set: "<green>Zone <yellow>{zone}</yellow> wurde aktualisiert.</green>"
  zone-usage: "<gray>Nutzung: <yellow>/cpsmpadmin setzone <danger|attack></yellow></gray>"
  info-header: "<gradient:#5BCEFA:#F5A9B8><bold>CPSMP</bold></gradient> <dark_gray>v{version}</dark_gray>"
  info-spawn: "<gray>SMP-Spawn: <yellow>{state}</yellow></gray>"
  info-portals: "<gray>Portale: <yellow>{count}</yellow> aktiv</gray>"
  info-zones: "<gray>Zonen: <yellow>Gefahr={danger}</yellow>, <yellow>Attack={attack}</yellow></gray>"
  info-platform: "<gray>Plattform: <yellow>{platform}</yellow> <dark_gray>|</dark_gray> Teleport-Backend: <yellow>{backend}</yellow></gray>"
  info-economy: "<gray>Economy: <yellow>{bridge}</yellow> <dark_gray>|</dark_gray> Provider: <yellow>{provider}</yellow></gray>"
  info-auction: "<gray>Auktionshaus: <yellow>{state}</yellow> <dark_gray>|</dark_gray> Storage: <yellow>{storage}</yellow> <dark_gray>|</dark_gray> Status: <yellow>{reason}</yellow></gray>"

economy:
  # Logged at startup when a provider was detected.
  detected: "<green>Economy-System erkannt: <yellow>{provider}</yellow></green>"
  # Logged at startup when no provider is available.
  none: "<gray>Kein Economy-System gefunden.</gray>"
  features-disabled: "<gray>Economy-Funktionen wurden deaktiviert.</gray>"
  disabled-in-config: "<gray>Economy-Integration ist in der Konfiguration deaktiviert.</gray>"
  vault-not-installed: "<gray>Vault ist nicht installiert.</gray>"
  vault-no-provider: "<gray>Vault gefunden, aber kein Economy-Provider registriert.</gray>"
  # Shown to players who try to use an economy-gated feature without a provider.
  unavailable: "<red>Diese Funktion benoetigt ein Economy-System.</red>"
  required: "<red>Diese Funktion benoetigt ein Economy-System.</red>"
  insufficient-funds: "<red>Du hast nicht genug Geld.</red>"
  invalid-amount: "<red>Ungueltiger Betrag.</red>"
  transaction-failed: "<red>Transaktion fehlgeschlagen.</red>"
  transaction-ok: "<green>Transaktion erfolgreich.</green>"

# Auktionshaus (V2.1) - alle Texte fuer das /ah Backend.
# Premium-Stil: kurz, sauber, keine Spam-Zeilen. Die finale GUI folgt
# in einer spaeteren Version; bis dahin liefert das Command-Interface
# alle Aktionen.
auction:
  no-permission: "<red>Dir fehlt die Berechtigung.</red>"
  disabled: "<gray>Das Auktionshaus ist derzeit nicht verfuegbar.</gray>"
  economy-required: "<red>Diese Funktion benoetigt ein Economy-System.</red>"
  storage-error: "<red>Auktionshaus-Speicher derzeit nicht erreichbar.</red>"
  # /ah help
  help: "<gradient:#5BCEFA:#F5A9B8><bold>Auktionshaus</bold></gradient> <dark_gray>|</dark_gray> <gray>Befehle:</gray>"
  help-sell: "<gray> <yellow>/ah sell <Preis></yellow> <dark_gray>-</dark_gray> Item in der Haupthand verkaufen.</gray>"
  help-listings: "<gray> <yellow>/ah listings</yellow> <dark_gray>-</dark_gray> Eigene aktive Angebote anzeigen.</gray>"
  help-cancel: "<gray> <yellow>/ah cancel <ID></yellow> <dark_gray>-</dark_gray> Eigenes Angebot zurueckziehen.</gray>"
  help-collect: "<gray> <yellow>/ah collect</yellow> <dark_gray>-</dark_gray> Bereitgestellte Items abholen.</gray>"
  help-browse: "<gray> <yellow>/ah browse [Seite]</yellow> <dark_gray>-</dark_gray> Aktive Angebote im Markt durchstoebern.</gray>"
  help-buy: "<gray> <yellow>/ah buy <ID></yellow> <dark_gray>-</dark_gray> Ein aktives Angebot kaufen.</gray>"
  help-admin: "<gray> <yellow>/ah admin <remove|info|reload></yellow></gray>"
  # /ah sell
  invalid-price: "<red>Ungueltiger Preis.</red>"
  price-too-low: "<red>Preis zu niedrig. Mindestens <yellow>{min}</yellow>.</red>"
  price-too-high: "<red>Preis zu hoch. Maximal <yellow>{max}</yellow>.</red>"
  invalid-item: "<red>Dieses Item kann nicht verkauft werden.</red>"
  blocked-item: "<red>Dieses Item ist im Auktionshaus gesperrt.</red>"
  max-listings-reached: "<gray>Du hast bereits <yellow>{max}</yellow> aktive Angebote.</gray>"
  listing-created: "<green>Angebot erstellt.</green> <dark_gray>(ID <yellow>{id}</yellow>, <yellow>{item}</yellow> x<yellow>{amount}</yellow> fuer <yellow>{price}</yellow>)</dark_gray>"
  # /ah listings
  listings-empty: "<gray>Du hast keine aktiven Angebote.</gray>"
  listings-header: "<gradient:#5BCEFA:#F5A9B8><bold>Deine Angebote</bold></gradient> <dark_gray>|</dark_gray> <gray><yellow>{count}</yellow> aktiv</gray>"
  listings-row: "<gray> <yellow>#{id}</yellow> <dark_gray>|</dark_gray> {item} x<yellow>{amount}</yellow> <dark_gray>|</dark_gray> <yellow>{price}</yellow> <dark_gray>|</dark_gray> <gray>noch <yellow>{time}</yellow></gray></gray>"
  # /ah cancel
  listing-cancelled: "<green>Angebot zurueckgezogen.</green> <dark_gray>(ID <yellow>{id}</yellow>, im Abholfach hinterlegt)</dark_gray>"
  listing-not-found: "<red>Dieses Angebot existiert nicht.</red>"
  not-your-listing: "<red>Dieses Angebot gehoert dir nicht.</red>"
  # /ah collect
  collect-empty: "<gray>Du hast keine Items zum Abholen.</gray>"
  collect-success: "<green>Abholung abgeschlossen.</green> <dark_gray>(<yellow>{count}</yellow> Items)</dark_gray>"
  collect-partial: "<gray>Abholung teilweise erledigt.</gray> <dark_gray>(<yellow>{count}</yellow> erhalten, <yellow>{remaining}</yellow> verbleiben - Inventar pruefen)</dark_gray>"
  # /ah browse (V2.2 Text-Ausgabe; die finale GUI folgt in V2.3)
  browse-empty: "<gray>Keine aktiven Auktionen gefunden.</gray>"
  browse-header: "<gradient:#5BCEFA:#F5A9B8><bold>Auktionen</bold></gradient> <dark_gray>|</dark_gray> <gray>Seite <yellow>{page}</yellow>/<yellow>{pages}</yellow> <dark_gray>(<yellow>{total}</yellow> aktiv)</dark_gray></gray>"
  browse-entry: "<gray> <yellow>#{id}</yellow> <dark_gray>|</dark_gray> {item} x<yellow>{amount}</yellow> <dark_gray>|</dark_gray> <yellow>{price}</yellow> <dark_gray>|</dark_gray> Verkaeufer: <yellow>{seller}</yellow> <dark_gray>|</dark_gray> <gray>laeuft ab in <yellow>{time}</yellow></gray></gray>"
  browse-page: "<gray>Naechste Seite: <yellow>/ah browse {next}</yellow> <dark_gray>(<yellow>{pages}</yellow> insgesamt)</dark_gray></gray>"
  # /ah buy (V2.2)
  buy-usage: "<gray>Nutzung: <yellow>/ah buy <ID></yellow></gray>"
  buy-not-found: "<red>Dieses Angebot existiert nicht.</red>"
  buy-not-active: "<red>Dieses Angebot ist nicht mehr verfuegbar.</red>"
  buy-expired: "<red>Dieses Angebot ist abgelaufen.</red>"
  buy-already-sold: "<red>Dieses Angebot wurde gerade verkauft.</red>"
  buy-own-listing: "<red>Du kannst dein eigenes Angebot nicht kaufen.</red>"
  buy-not-enough-money: "<red>Du hast nicht genug Geld.</red>"
  buy-economy-failed: "<red>Transaktion fehlgeschlagen. Bitte versuche es erneut.</red>"
  buy-storage-error: "<red>Kauf konnte nicht abgeschlossen werden. Bitte versuche es spaeter erneut.</red>"
  buy-success: "<green>Kauf abgeschlossen.</green> <dark_gray>(ID <yellow>{id}</yellow>, <yellow>{item}</yellow> x<yellow>{amount}</yellow> fuer <yellow>{price}</yellow> von <yellow>{seller}</yellow>)</dark_gray>"
  buy-inventory-full: "<gray>Dein Inventar ist voll. Das Item wurde zum Abholen gespeichert.</gray>"
  # Optional zweite Zeile nach buy-success, wenn sale-tax-percent > 0 ist.
  sale-tax-info: "<gray>Auktionsgebuehr: <yellow>{tax}</yellow> <dark_gray>|</dark_gray> Auszahlung an Verkaeufer: <yellow>{payout}</yellow></gray>"
  # Wird angezeigt, wenn der Verkaeufer-Payout fehlschlug und der Kauf
  # automatisch zurueckgerollt wurde. Dein Geld ist wieder bei dir.
  seller-payout-failed: "<red>Transaktion fehlgeschlagen: Auszahlung an den Verkaeufer war nicht moeglich. Dein Geld wurde zurueckerstattet.</red>"
  # /ah admin
  admin-usage: "<gray>Nutzung: <yellow>/ah admin <remove <ID>|info|reload></yellow></gray>"
  admin-removed: "<green>Angebot entfernt.</green> <dark_gray>(ID <yellow>{id}</yellow>, Verkaeufer <yellow>{seller}</yellow>; Item im Abholfach des Verkaeufers)</dark_gray>"
  admin-info-header: "<gradient:#5BCEFA:#F5A9B8><bold>Auktionshaus</bold></gradient>"
  admin-info-state: "<gray>Aktiv: <yellow>{state}</yellow> <dark_gray>|</dark_gray> Status: <yellow>{reason}</yellow></gray>"
  admin-info-storage: "<gray>Storage: <yellow>{type}</yellow></gray>"
  admin-info-counts: "<gray>Angebote: <yellow>{active}</yellow> aktiv, <yellow>{sold}</yellow> verkauft, <yellow>{expired}</yellow> abgelaufen, <yellow>{cancelled}</yellow> zurueckgezogen <dark_gray>|</dark_gray> Abholfach: <yellow>{collect}</yellow></gray>"
  admin-info-tax: "<gray>Verkaufssteuer: <yellow>{percent}%</yellow></gray>"
  admin-info-economy: "<gray>Economy: <yellow>{bridge}</yellow> <dark_gray>|</dark_gray> Provider: <yellow>{provider}</yellow> <dark_gray>|</dark_gray> verfuegbar: <yellow>{available}</yellow></gray>"
  reload-success: "<green>Auktionshaus-Konfiguration neu geladen.</green>"
  # Used by future expiry notifications (V2.2+). Already declared so
  # admins can translate / restyle the string today.
  expired-returned: "<gray>Dein Angebot ist abgelaufen. Verwende <yellow>/ah collect</yellow>, um das Item zurueckzuholen.</gray>"
