# CPSMP player-facing strings (German).
# MiniMessage format. {placeholders} are replaced at runtime.

general:
  no-permission: "<red>Dazu hast du keine Berechtigung.</red>"
  player-only: "<red>Dieser Befehl ist nur fuer Spieler verfuegbar.</red>"
  unknown-command: "<red>Unbekannter Befehl.</red>"
  reload-success: "<green>Konfiguration wurde neu geladen.</green>"
  world-missing: "<red>Welt <yellow>{world}</yellow> ist nicht geladen.</red>"
  cooldown: "<gray>Bitte warte noch <yellow>{time}</yellow> Sekunden.</gray>"

teleport:
  start: "<gray>Teleportation startet...</gray>"
  countdown-actionbar: "<gray>Teleport in <yellow>{time}</yellow>s <dark_gray>|</dark_gray> <red>Bewege dich nicht.</red></gray>"
  do-not-move: "<red>Bewege dich nicht.</red>"
  cancelled-move: "<red>Teleportation abgebrochen.</red>"
  cancelled-damage: "<red>Teleportation durch Schaden abgebrochen.</red>"
  success: "<green>Teleportation erfolgreich.</green>"

spawn:
  welcome-title: "SMP-Spawn"
  welcome-subtitle: "Willkommen am SMP-Spawn."
  welcome-actionbar: "<green>Willkommen am SMP-Spawn.</green>"
  not-configured: "<red>Der SMP-Spawn wurde noch nicht gesetzt.</red>"

rtp:
  searching-actionbar: "<gray>Suche sicheren Ort...</gray>"
  found-actionbar: "<green>Sicherer Ort gefunden.</green>"
  success-title: "CPSMP"
  success-subtitle: "Dein Abenteuer beginnt."
  failed: "<red>Es konnte kein sicherer Ort gefunden werden.</red>"
  world-not-allowed: "<red>RTP ist in dieser Welt nicht erlaubt.</red>"

portal:
  cooldown: "<gray>Portal-Cooldown. Bitte kurz warten.</gray>"
  default-title: "Portal"
  default-subtitle: "Du wirst teleportiert."
  default-actionbar: "<aqua>Portal aktiviert.</aqua>"
  target-missing: "<red>Dieses Portal ist nicht korrekt konfiguriert.</red>"
  bypass-active: "<gray>Portal-Bypass aktiv, solange du schleichst.</gray>"
  not-inside: "<gray>Du stehst nicht im Portalbereich.</gray>"

zones:
  danger:
    enter-title: "Gefahrenzone"
    enter-subtitle: "PvP ist aktiviert. Sei vorsichtig."
    enter-actionbar: "<red>Du betrittst die Gefahrenzone.</red>"
    no-permission: "<red>Du darfst die Gefahrenzone nicht betreten.</red>"
    not-configured: "<red>Die Gefahrenzone ist noch nicht konfiguriert.</red>"
  attack:
    enter-title: "Attack-Zone"
    enter-subtitle: "Kaempfe. Ueberlebe. Dominiere."
    enter-actionbar: "<dark_red>Du betrittst die Attack-Zone.</dark_red>"
    no-permission: "<red>Du darfst die Attack-Zone nicht betreten.</red>"
    not-configured: "<red>Die Attack-Zone ist noch nicht konfiguriert.</red>"

admin:
  usage: "<gray>Nutzung: <yellow>/cpsmpadmin <setspawn|setportal|portal|setzone|reload|info></yellow></gray>"
  spawn-set: "<green>SMP-Spawn wurde gesetzt.</green>"
  # /cpsmpadmin setportal feedback (just saving a corner; never enables).
  portal-set-pos1: "<green>Portal <yellow>{portal}</yellow>: Position 1 gesetzt.</green>"
  portal-set-pos2: "<green>Portal <yellow>{portal}</yellow>: Position 2 gesetzt.</green>"
  portal-set-target: "<green>Portal <yellow>{portal}</yellow>: Zielort gesetzt.</green>"
  portal-unknown: "<red>Unbekanntes Portal: <yellow>{portal}</yellow></red>"
  portal-usage: "<gray>Nutzung: <yellow>/cpsmpadmin setportal <name> <pos1|pos2|target></yellow></gray>"
  # Setup-safety warnings raised by setCorner / portal info / portal enable.
  portal-incomplete: "<yellow>Portal ist unvollstaendig. Beide Ecken (pos1 und pos2) muessen gesetzt sein.</yellow>"
  portal-cross-world: "<red>pos1 und pos2 muessen in derselben Welt liegen.</red>"
  portal-size: "<gray>Portalbereich: <yellow>{sizeX}x{sizeY}x{sizeZ}</yellow> Bloecke.</gray>"
  portal-large-region: "<gold>Achtung: Dieser Portalbereich ist sehr gross (<yellow>{size}</yellow> Bloecke). Pruefe pos1 und pos2.</gold>"
  # /cpsmpadmin portal <name> <action> feedback.
  portal-action-usage: "<gray>Nutzung: <yellow>/cpsmpadmin portal <name> <enable|disable|reset|info></yellow></gray>"
  portal-enabled: "<green>Portal <yellow>{portal}</yellow> aktiviert.</green>"
  portal-disabled: "<gray>Portal <yellow>{portal}</yellow> deaktiviert.</gray>"
  portal-reset: "<gray>Portal <yellow>{portal}</yellow> zurueckgesetzt.</gray>"
  portal-valid: "<green>Portal ist gueltig.</green>"
  portal-invalid: "<red>Portal ist ungueltig.</red>"
  portal-info-header: "<gradient:#5BCEFA:#F5A9B8><bold>Portal {portal}</bold></gradient>"
  portal-info-enabled: "<gray>Aktiviert: <yellow>{state}</yellow></gray>"
  portal-info-type: "<gray>Typ: <yellow>{type}</yellow></gray>"
  portal-info-world: "<gray>Welt: <yellow>{world}</yellow></gray>"
  portal-info-pos1: "<gray>pos1: <yellow>{pos}</yellow></gray>"
  portal-info-pos2: "<gray>pos2: <yellow>{pos}</yellow></gray>"
  portal-info-bounds: "<gray>Normalisiert: <yellow>{min}</yellow> -> <yellow>{max}</yellow></gray>"
  portal-info-target: "<gray>Zielort: <yellow>{target}</yellow></gray>"
  zone-set: "<green>Zone <yellow>{zone}</yellow> wurde aktualisiert.</green>"
  zone-usage: "<gray>Nutzung: <yellow>/cpsmpadmin setzone <danger|attack></yellow></gray>"
  info-header: "<gradient:#5BCEFA:#F5A9B8><bold>CPSMP</bold></gradient> <dark_gray>v{version}</dark_gray>"
  info-spawn: "<gray>SMP-Spawn: <yellow>{state}</yellow></gray>"
  info-portals: "<gray>Portale: <yellow>{count}</yellow> aktiv</gray>"
  info-zones: "<gray>Zonen: <yellow>Gefahr={danger}</yellow>, <yellow>Attack={attack}</yellow></gray>"
  info-platform: "<gray>Plattform: <yellow>{platform}</yellow> <dark_gray>|</dark_gray> Teleport-Backend: <yellow>{backend}</yellow></gray>"
  info-economy: "<gray>Economy: <yellow>{bridge}</yellow> <dark_gray>|</dark_gray> Provider: <yellow>{provider}</yellow></gray>"

economy:
  # Logged at startup when a provider was detected.
  detected: "<green>Economy-System erkannt: <yellow>{provider}</yellow></green>"
  # Logged at startup when no provider is available.
  none: "<gray>Kein Economy-System gefunden.</gray>"
  features-disabled: "<gray>Economy-Funktionen wurden deaktiviert.</gray>"
  disabled-in-config: "<gray>Economy-Integration ist in der Konfiguration deaktiviert.</gray>"
  vault-not-installed: "<gray>Vault ist nicht installiert.</gray>"
  vault-no-provider: "<gray>Vault gefunden, aber kein Economy-Provider registriert.</gray>"
  # Shown to players who try to use an economy-gated feature without a provider.
  unavailable: "<red>Diese Funktion benoetigt ein Economy-System.</red>"
  required: "<red>Diese Funktion benoetigt ein Economy-System.</red>"
  insufficient-funds: "<red>Du hast nicht genug Geld.</red>"
  invalid-amount: "<red>Ungueltiger Betrag.</red>"
  transaction-failed: "<red>Transaktion fehlgeschlagen.</red>"
  transaction-ok: "<green>Transaktion erfolgreich.</green>"
